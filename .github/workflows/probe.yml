name: Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - name: probe
        run: |
          cat > probe-tmp.mjs <<'JS'
          import { webkit } from 'playwright'
          import { serve } from './test/serve.js'
          const site = await serve()
          const browser = await webkit.launch()
          const ctx = await browser.newContext({ viewport: { width: 390, height: 844 }, hasTouch: true, deviceScaleFactor: 2, reducedMotion: 'reduce', locale: 'en-GB' })
          await ctx.route((u) => u.hostname !== '127.0.0.1', async (route) => {
            const u = new URL(route.request().url())
            console.log('ROUTE', route.request().method(), u.host, u.pathname)
            if (u.host === 'nominatim.openstreetmap.org') return route.fulfill({ status: 200, contentType: 'application/json', headers: { 'access-control-allow-origin': '*' }, body: JSON.stringify([{ lat: '25.0338352', lon: '121.5644995', name: 'T101', display_name: 'T101, Taipei', address: { city: 'Taipei', country_code: 'tw' } }]) })
            return route.abort()
          })
          const page = await ctx.newPage()
          page.on('console', (m) => console.log('CONSOLE', m.type(), m.text().slice(0, 200)))
          page.on('pageerror', (e) => console.log('PAGEERROR', e.message))
          page.on('requestfailed', (r) => console.log('REQFAILED', r.url().slice(0, 100), r.failure()?.errorText))
          await page.goto(site.url)
          await page.waitForSelector('html[data-ready]')
          await page.click('#setup')
          await page.waitForSelector('html[data-wizard]')
          await page.fill('#place-q', 'Taipei 101')
          await page.press('#place-q', 'Enter')
          await page.waitForSelector('.modal[role=dialog]')
          console.log('MODAL', (await page.locator('.modal').innerText()).slice(0, 80).replace(/\n/g, ' | '))
          await page.click('.modal button.primary')
          await new Promise((r) => setTimeout(r, 4000))
          console.log('RESULTS', JSON.stringify(await page.locator('.result-list').innerText()))
          console.log('STATUS', JSON.stringify(await page.locator('.search-row ~ p[role=status]').innerText()))
          console.log('WHERE', JSON.stringify(await page.locator('.where').innerText()))
          // the floor plan tap flow: pointer events from a touch tap
          await page.click('#wiz-next')
          await page.click('#trace-open')
          await page.waitForSelector('.pic-canvas')
          const png = await page.evaluate(async () => { const c = document.createElement('canvas'); c.width = 800; c.height = 600; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 800, 600); g.strokeRect(200, 100, 400, 300); const b = await new Promise((r) => c.toBlob(r, 'image/png')); const u = new Uint8Array(await b.arrayBuffer()); let s = ''; for (const x of u) s += String.fromCharCode(x); return btoa(s) })
          await page.setInputFiles('.wiz-step input[type=file]', { name: 'p.png', mimeType: 'image/png', buffer: Buffer.from(png, 'base64') })
          await page.waitForSelector('text=Tap two points whose real distance', { timeout: 8000 }).catch((e) => console.log('NOSCALEHELP', e.message.slice(0, 80)))
          const box = await page.locator('.pic-canvas').boundingBox()
          console.log('PICBOX', JSON.stringify(box))
          await page.touchscreen.tap(box.x + 40, box.y + 40)
          await page.touchscreen.tap(box.x + 200, box.y + 40)
          console.log('TAPS', JSON.stringify(await page.locator('.wiz-step').innerText()).slice(0, 300))
          await browser.close(); await site.close()
          JS
          node probe-tmp.mjs

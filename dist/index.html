:root {
  --radius: 14px;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "Noto Sans SC", "Noto Sans JP", "Noto Sans KR", sans-serif;
  --display: "Fraunces Variable", "Iowan Old Style", Georgia, "Noto Serif TC", serif;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: light;
}
[data-theme="light"] {
  --bg: #f7f1e6;
  --surface: #fffaf0;
  --surface-2: #f3ead9;
  --ink: #231b12;
  --muted: #6b5f50;
  --line: #e2d5bd;
  --accent: #c2410c;
  --accent-ink: #ffffff;
  --sun: #f5a524;
  --focus: #2b5fd9;
  --stage: #f1e7d3;
  --stage-2: #fbf4e6;
  --shadow: 0 12px 32px rgba(86, 58, 20, 0.12);
}
[data-theme="dark"] {
  --bg: #0b0f1c;
  --surface: #131a2d;
  --surface-2: #1a2340;
  --ink: #f3ebdd;
  --muted: #a1abc2;
  --line: #27314f;
  --accent: #ffb547;
  --accent-ink: #1c1405;
  --sun: #ffc24b;
  --focus: #8ab6ff;
  --stage: #10162a;
  --stage-2: #18213d;
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--ui);
  -webkit-text-size-adjust: 100%;
  /* a phone on its side with a notch: keep the page out from under it */
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  transition: background 0.4s var(--ease), color 0.4s var(--ease);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 6px; background: var(--surface); padding: 8px 12px; border-radius: 8px; z-index: 50; }
.skip:focus { left: 8px; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.brand-h1 { margin: 0; font: inherit; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand .logo { width: 30px; height: 30px; }
.brand .logo rect, .brand .logo path:nth-of-type(1) { stroke: var(--ink); }
.brand .logo path:last-of-type { fill: var(--sun); }
.brand-name { font: 600 22px/1 var(--display); letter-spacing: -0.01em; }
.brand-tag { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.icon-btn, .select {
  height: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0 10px;
  transition: background 0.2s, transform 0.15s var(--ease), border-color 0.2s;
}
.icon-btn { min-width: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.icon-btn:hover:not(:disabled), .select:hover { background: var(--surface-2); }
.icon-btn:active:not(:disabled) { transform: scale(0.96); }
.icon-btn:disabled { opacity: 0.4; cursor: default; }
.icon-btn.wide { padding: 0 12px; }
.gh { color: inherit; text-decoration: none; font-weight: 600; }
.gh svg { fill: currentColor; flex: none; }
.select { padding-right: 6px; max-width: 150px; }

/* layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 14px; padding: 0 16px 16px; min-height: 0; height: calc(100vh - 56px); height: calc(100dvh - 56px); }
.stage-wrap { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; min-height: 0; min-width: 0; }
.stage {
  position: relative; border-radius: 22px; overflow: hidden; min-height: 280px;
  background: radial-gradient(120% 90% at 30% 10%, var(--stage-2), var(--stage));
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; display: block; cursor: ew-resize; }
#canvas:focus-visible { outline-offset: -4px; }
.stage-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
.stage-top > * { pointer-events: auto; }
.stage-top .chip { margin-left: auto; }

.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; }
.seg button {
  border: 0; background: transparent; border-radius: 8px; padding: 6px 12px; color: var(--muted); font-weight: 600;
  transition: background 0.25s var(--ease), color 0.25s;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg.small button { padding: 4px 9px; font-size: 12.5px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 13px;
  transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.15s var(--ease);
}
.chip:hover { border-color: var(--muted); }
.chip:active { transform: scale(0.97); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.legend {
  position: absolute; right: 12px; bottom: 12px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(6px);
  border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px 6px; width: min(260px, 60%); animation: rise 0.35s var(--ease);
}
.legend b { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
.legend .ramp { height: 8px; border-radius: 4px; }
.legend .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.tip {
  position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 9px; font-size: 12.5px;
  white-space: nowrap; transform: translate(12px, -120%); z-index: 3; box-shadow: var(--shadow);
}
.hint { position: absolute; left: 0; right: 0; bottom: 10px; margin: 0; text-align: center; font-size: 12.5px; color: var(--muted); pointer-events: none; transition: opacity 0.6s; }
.hint.gone, .legend:not([hidden]) ~ .hint { opacity: 0; }
.busy { position: absolute; left: 12px; bottom: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 12.5px; display: flex; gap: 10px; align-items: center; }
.busy .bar { width: 90px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.busy .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.15s linear; }

/* dock */
.dock {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 18px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px; box-shadow: var(--shadow);
}
.clock { min-width: 190px; }
.clock .time { font: 560 40px/1 var(--display); font-variant-numeric: tabular-nums lining-nums; letter-spacing: -0.02em; display: block; }
.clock .sub { color: var(--muted); font-size: 12.5px; display: block; margin-top: 4px; min-height: 18px; }
.rail { position: relative; height: 54px; }
.rail canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.rail input[type="range"] { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; background: transparent; }
.rail-ends { grid-column: 2; display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; margin-top: -4px; font-variant-numeric: tabular-nums; }
.dock-controls { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
.play {
  width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center;
  transition: transform 0.2s var(--ease), box-shadow 0.2s; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent);
}
.play:hover { transform: scale(1.06); }
.play:active { transform: scale(0.95); }
.play svg { width: 18px; height: 18px; fill: currentColor; }
.dock-row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 8px; border-top: 1px dashed var(--line); }
.dock-row .grow { flex: 1; }
.date-pick { display: inline-flex; gap: 6px; align-items: center; }
.date-pick .select, .date-pick input { height: 32px; }
.stats { display: flex; gap: 14px; margin-top: 8px; }
.stat { display: inline-flex; flex-direction: column; font-size: 11.5px; color: var(--muted); line-height: 1.25; }
.stat b { font: 600 15px/1.2 var(--ui); color: var(--ink); font-variant-numeric: tabular-nums; }

input[type="range"] { -webkit-appearance: none; appearance: none; height: 28px; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,.3); transition: transform 0.15s var(--ease); }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.18); }
.rail input[type="range"]::-webkit-slider-runnable-track { background: transparent; }
.rail input[type="range"]::-moz-range-track { background: transparent; }

/* panel */
.panel { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
.tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: transparent; padding: 10px 12px; color: var(--muted); font-weight: 600; position: relative; white-space: nowrap; transition: color 0.2s; }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs button::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); transform: scaleX(0); transition: transform 0.3s var(--ease); }
.tabs button[aria-selected="true"]::after { transform: scaleX(1); }
.tab-body { overflow: auto; padding: 14px 16px 18px; flex: 1; min-height: 0; }
.tab-body > section { animation: rise 0.32s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.foot { padding: 10px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.foot a { color: inherit; }

h2 { font: 600 17px/1.2 var(--display); margin: 18px 0 8px; letter-spacing: -0.005em; }
h2:first-child { margin-top: 2px; }
h3 { font: 700 11.5px/1.2 var(--ui); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
p.note { color: var(--muted); font-size: 12.5px; margin: 6px 0; }
.card { border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 10px 12px 12px; margin: 10px 0; transition: border-color 0.25s, box-shadow 0.25s; }
.card.selected { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.card-head b { font-weight: 650; flex: 1; }
.mini { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 8px; font-size: 12px; }
.mini:hover { background: var(--bg); }
.field { display: grid; grid-template-columns: 1fr 88px; gap: 2px 10px; align-items: center; margin: 6px 0; }
.field label { font-size: 12.5px; color: var(--muted); grid-column: 1; }
.field input[type="range"] { grid-column: 1; width: 100%; height: 22px; }
.field input[type="number"], .num {
  grid-column: 2; grid-row: 1 / span 2; width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 0 8px; text-align: right; font-variant-numeric: tabular-nums;
}
input[type="text"], input[type="search"], input[type="time"], input[type="url"], .text {
  width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 10px;
}
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 0; }
.row > .fixed { flex: none; }
/* three buttons with long words go to a second line on a narrow phone */
.row.data-row > * { flex: 1 1 9em; }
.row input[type="time"] { min-width: 132px; }
.btn {
  height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-weight: 600;
  transition: background 0.2s, transform 0.15s var(--ease), border-color 0.2s;
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--muted); }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.block { width: 100%; }
.check { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.results { display: grid; gap: 8px; margin: 8px 0; }
.big { font: 560 26px/1.1 var(--display); font-variant-numeric: lining-nums; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 3px 0; }
.kv span:first-child { color: var(--muted); }
.kv b { font-variant-numeric: tabular-nums; text-align: right; }
.suggest { list-style: none; padding: 0; margin: 4px 0 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.suggest li button { width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; display: flex; justify-content: space-between; gap: 8px; }
.suggest li button:hover, .suggest li button:focus-visible { background: var(--surface-2); }
.suggest small { color: var(--muted); }
.dial { display: block; margin: 8px auto; touch-action: none; cursor: grab; }
.dial:active { cursor: grabbing; }
.tag { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin: 8px 0; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s linear; }
.preview { width: 100%; border-radius: 12px; border: 1px solid var(--line); margin-top: 8px; display: block; }
.spot { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.spot:last-child { border-bottom: 0; }
.spot .n { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex: none; }
.spot span:nth-child(2) { flex: 1; }

.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 24px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px;
  opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s var(--ease); z-index: 60; box-shadow: var(--shadow); max-width: 90vw;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.live, .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

@media (max-width: 960px) {
  .layout { grid-template-columns: 1fr; height: auto; padding: 0 10px 14px; }
  .stage { height: min(86vw, 520px); min-height: 300px; }
  .panel { overflow: visible; }
  .tab-body { overflow: visible; }
  .brand-tag { display: none; }
  .dock { grid-template-columns: 1fr auto; }
  .rail, .rail-ends { grid-column: 1 / -1; }
  .dock-controls { grid-column: 2; grid-row: 1; }
  .clock .time { font-size: 34px; }
  .top { flex-wrap: wrap; }
  .select { max-width: 110px; }
}
@media (max-width: 520px) {
  .top-tools { gap: 4px; }
  #undo, #redo { display: none; }
  .gh span { display: none; }
  .gh.wide { padding: 0 9px; }
  .legend { width: 70%; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; }
.field.compact { grid-template-columns: 1fr; margin: 4px 0; }
.field.compact input[type="number"] { grid-column: 1; grid-row: 2; text-align: left; }

.dial:focus { outline: none; }
.dial:focus-visible .ring { stroke: var(--focus); stroke-width: 4; }

/* guided setup */
.setup { margin-left: 4px; min-height: 36px; height: auto; padding-top: 5px; padding-bottom: 5px; line-height: 1.2; max-width: 100%; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent); }
.wizard {
  display: none; flex-direction: column; min-height: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: 22px; box-shadow: var(--shadow); overflow: hidden;
}
html[data-wizard] .wizard { display: flex; }
html[data-wizard] .panel, html[data-wizard] .dock, html[data-wizard] .setup { display: none; }
html[data-wizard] .stage-wrap { grid-template-rows: minmax(0, 1fr); }
.wiz-head { padding: 10px 14px 6px; border-bottom: 1px solid var(--line); }
.wiz-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wiz-dots { display: flex; gap: 8px; list-style: none; margin: 0; padding: 0; align-items: center; }
.wiz-dots button { position: relative; width: 12px; height: 12px; border-radius: 6px; border: 2px solid var(--line); background: transparent; padding: 0; transition: width 0.25s var(--ease), background 0.25s; }
.wiz-dots button::before { content: ""; position: absolute; inset: -14px -4px; }
.wiz-dots button.on { width: 24px; background: var(--accent); border-color: var(--accent); }
.wiz-dots button.done { background: var(--ink); border-color: var(--ink); }
@media (max-width: 359px) { .wiz-dots { gap: 5px; } .wiz-top .mini { padding: 4px 7px; } }
.wiz-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 6px; }
.wiz-count { margin: 0; font-size: 12px; color: var(--muted); }
.wiz-meta .linkbtn { font-size: 12px; color: var(--muted); }
.wiz-title { margin: 2px 0 4px; font: 600 21px/1.2 var(--display); }
.wiz-title:focus { outline: none; }
.wiz-body { flex: 1; overflow: auto; padding: 12px 14px 18px; min-height: 0; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.wiz-step { animation: rise 0.3s var(--ease); }
.wiz-step > p:first-child, .wiz-step > div > p:first-child { margin-top: 2px; }
.wiz-nav { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); }
.wiz-nav .btn { min-width: 112px; }
.search-row { display: flex; gap: 8px; margin: 10px 0 6px; }
.search-row input { flex: 1; min-width: 0; }
.result-list { list-style: none; margin: 6px 0 10px; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.result-list:empty { display: none; }
.result-list li + li { border-top: 1px solid var(--line); }
.result-list button { width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; display: flex; flex-direction: column; gap: 1px; min-height: 48px; }
.result-list button:hover, .result-list button:focus-visible { background: var(--surface-2); }
.rl-name { font-weight: 650; }
.result-list small { color: var(--muted); font-size: 12px; }
.where { font-weight: 600; font-size: 13px; margin: 10px 0; }
.more { margin: 10px 0; }
.more summary { cursor: pointer; font-weight: 600; padding: 8px 0; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.tpl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 8px 0; }
.tpl { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-height: 56px; transition: border-color 0.2s, transform 0.15s var(--ease); }
.tpl:hover { border-color: var(--muted); }
.tpl:active { transform: scale(0.98); }
.tpl small { color: var(--muted); font-size: 12px; }
.turn .btn { padding: 0 8px; }
.compass-reading { font: 600 34px/1.1 var(--display); text-align: center; margin: 10px 0; font-variant-numeric: lining-nums; }
.tag.est { background: color-mix(in srgb, var(--sun) 28%, var(--surface)); border-color: color-mix(in srgb, var(--sun) 60%, var(--line)); color: var(--ink); }
.obstacle-list .card { padding: 8px 10px 10px; margin: 8px 0; cursor: pointer; }
.obstacle-list .card-head b { font-size: 13px; font-weight: 650; }
.obstacle-list .check { margin: 0; }
.big-line { font: 600 17px/1.25 var(--display); margin: 6px 0; }
.num-in { width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 0 8px; }
.field.compact label { font-size: 12.5px; color: var(--muted); }
.verdict .big { display: block; }
.trace-steps { display: flex; list-style: none; gap: 4px 10px; padding: 0; margin: 6px 0 10px; font-size: 11.5px; flex-wrap: wrap; color: var(--muted); }
.trace-steps li[aria-current] { font-weight: 700; color: var(--ink); }
.trace-steps li.done { text-decoration: line-through; }

/* map and pictures over the stage */
.mapview { position: absolute; inset: 0; z-index: 2; background: var(--stage); }
.stage.map-on #canvas, .stage.map-on .stage-top, .stage.map-on .hint, .stage.map-on .legend, .stage.map-on .busy { visibility: hidden; }
.map-canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.map-canvas:focus-visible { outline-offset: -4px; }
.map-zoom { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.map-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; line-height: 1; box-shadow: var(--shadow); }
.map-credit { position: absolute; right: 6px; bottom: 4px; font-size: 10.5px; background: rgba(255, 255, 255, 0.8); padding: 1px 6px; border-radius: 4px; color: #333; text-decoration: none; }
.map-cta { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); }
.map-cta .btn { box-shadow: var(--shadow); height: 40px; white-space: nowrap; }
.tracepane { position: absolute; inset: 0; z-index: 3; background: var(--stage-2); }
.pic-canvas { width: 100%; height: 100%; display: block; touch-action: none; }

/* sheets */
.modal-root { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(10, 10, 20, 0.5); animation: fade 0.2s; }
.modal { position: relative; background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-width: 540px; max-height: 88vh; max-height: 88dvh; overflow: auto; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow: var(--shadow); animation: rise 0.3s var(--ease); }
.modal h2 { margin-top: 0; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.net-row { border-top: 1px solid var(--line); padding: 8px 0; }
.net-row .host { font-family: ui-monospace, monospace; font-size: 11.5px; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (min-width: 700px) { .modal-root { align-items: center; } .modal { border-radius: 20px; } }
.linkbtn { border: 0; background: none; padding: 0; text-decoration: underline; color: inherit; font: inherit; cursor: pointer; }

@media (pointer: coarse) {
  /* below 16px Safari on an iPhone zooms the page in when a box gets the focus */
  input, select, textarea { font-size: 16px; }
  .btn, .chip, .select, .num-in, input[type="text"], input[type="number"], input[type="search"], input[type="time"] { min-height: 44px; }
  .mini { min-height: 36px; padding: 6px 12px; }
  .field input[type="range"] { height: 32px; }
  .check input { width: 22px; height: 22px; }
}

@media (max-width: 960px) {
  .top { gap: 8px; }
  .setup { margin-left: auto; order: 2; }
  .top-tools { order: 3; flex: 1 0 100%; justify-content: flex-end; margin-left: 0; }
  html[data-wizard] body { overflow: hidden; }
  html[data-wizard] .app { height: 100vh; height: 100dvh; min-height: 0; grid-template-rows: auto minmax(0, 1fr); }
  html[data-wizard] .layout { display: flex; flex-direction: column; gap: 8px; padding: 0 8px 8px; height: auto; min-height: 0; }
  html[data-wizard] .stage-wrap { flex: 0 0 auto; display: block; }
  html[data-wizard] .stage { height: min(38vh, 330px); height: min(38dvh, 330px); min-height: 190px; }
  html[data-wizard] .wizard { flex: 1; min-height: 0; border-radius: 18px; }
  html[data-wizard] .top { padding: 6px 12px; }
  html[data-wizard] .brand-name, html[data-wizard] .brand-tag { display: none; }
  html[data-wizard] .top-tools { flex: 1; flex-basis: auto; }
}
@media (max-width: 520px) {
  .setup { height: 40px; padding: 0 12px; }
  .top-tools { order: 3; }
  .tpl-grid { grid-template-columns: 1fr 1fr; }
  .wiz-nav .btn { min-height: 46px; }
}

/* the setup's Back and Next stay uncovered by the short messages */
html[data-wizard] .toast { bottom: calc(92px + env(safe-area-inset-bottom)); }
@media (min-width: 961px) { html[data-wizard] .toast { bottom: 24px; } }

/* a wide system font, a long language name or a narrow phone must wrap the header, never widen the page */
.app > *, .layout > *, .top > * { min-width: 0; }
.top-tools { flex-wrap: wrap; row-gap: 6px; }
@media (max-width: 960px) {
  .select { max-width: min(150px, 42vw); }
  .top-tools { max-width: 100%; }
  html[data-wizard] .top-tools { flex-wrap: wrap; justify-content: flex-end; }
}

/* a phone on its side: the view and the step side by side, as on a desktop */
@media (orientation: landscape) and (max-height: 520px) and (max-width: 960px) {
  html[data-wizard] .layout { flex-direction: row; gap: 8px; }
  html[data-wizard] .stage-wrap { flex: 1 1 52%; display: grid; grid-template-rows: minmax(0, 1fr); }
  html[data-wizard] .stage { height: 100%; min-height: 0; }
  html[data-wizard] .wizard { flex: 1 1 48%; }
  html[data-wizard] .top { padding: 2px 12px; }
  .wiz-head { padding: 6px 12px 4px; }
  .wiz-title { font-size: 18px; margin: 0 0 2px; }
  .wiz-nav { padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
}
html[data-wizard] .hint { display: none; }

.time-row { margin: 10px 0; }
.map-time { font: 600 20px/1 var(--display); font-variant-numeric: tabular-nums lining-nums; min-width: 3.4em; }
.time-row input[type="range"] { flex: 1; min-width: 0; }

.saved-list { margin: 8px 0; }
.saved-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 10px 12px; margin: 8px 0; }
.saved-text { flex: 1 1 10em; min-width: 0; display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
.saved-text .note { margin: 0; }
.saved-buttons { display: flex; gap: 8px; flex: 0 0 auto; }
.saved-buttons .btn { min-width: 5.5em; }
.saved .row > input { flex: 1 1 9em; }

/* the quick check: a search box over a map, the answer in a sheet under it */
.quick { display: none; position: fixed; inset: 0; z-index: 10; background: var(--bg); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
html[data-quick] .quick { display: grid; }
html[data-quick] .app, html[data-quick] .skip:not(:focus) { display: none; }
html[data-quick] body { overflow: hidden; }
.quick-search { display: flex; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; background: var(--bg); }
.quick-search .quick-q { flex: 1; min-width: 0; height: 48px; border-radius: 14px; padding: 0 14px; font-size: 16px; }
.quick-search .btn { height: 48px; min-width: 48px; }
.quick-locate { display: inline-flex; align-items: center; justify-content: center; padding: 0 10px; }
.quick-map { position: relative; min-height: 150px; overflow: hidden; background: var(--stage); border-top: 1px solid var(--line); }
.quick-chips { position: absolute; right: 10px; top: 72px; display: flex; gap: 6px; }
.quick-chips .chip { box-shadow: var(--shadow); min-height: 40px; }
.quick-recenter { position: absolute; right: 10px; bottom: 30px; height: 40px; box-shadow: var(--shadow); }
.quick-point { position: absolute; left: 0; right: 0; bottom: 30px; display: flex; justify-content: center; pointer-events: none; }
.quick-point .btn { pointer-events: auto; height: 44px; white-space: nowrap; box-shadow: var(--shadow); }
.quick-result.stale { opacity: 0.45; transition: opacity 0.2s; }
.quick-sheet { display: flex; flex-direction: column; min-height: 0; max-height: 62vh; max-height: 62dvh; background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 28px rgba(86, 58, 20, 0.16); }
.quick-sheet[data-open="0"] { max-height: none; }
.quick-sheet[data-open="0"] .quick-body { display: none; }
.quick-grab { border: 0; background: none; height: 26px; padding: 0; display: flex; align-items: center; justify-content: center; flex: none; min-height: 26px; }
.quick-grab span { width: 44px; height: 5px; border-radius: 3px; background: var(--line); }
.quick-body { overflow: auto; padding: 0 14px 10px; flex: 1; min-height: 0; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.quick-body h2 { margin-top: 0; font-size: 20px; }
.quick-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 4px; }
.quick-head h2 { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.quick-head .btn { flex: none; height: 44px; min-width: 72px; }
.quick-linkbox { width: 100%; height: 44px; font-size: 14px; }
.quick-body p { margin: 8px 0; }
.quick-status { font-weight: 600; }
p.note.warn, .note.warn { color: var(--accent); font-weight: 600; }
.quick-foot { display: flex; flex-wrap: nowrap; align-items: center; gap: 6px 12px; padding: 6px 14px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; flex: none; }
.quick-foot .select { height: 32px; max-width: 104px; padding-left: 6px; margin-left: auto; }
.quick-floor { margin: 10px 0 6px; }
.qf-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.qf-label { font-weight: 650; }
.qf-btn { width: 52px; height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-size: 28px; line-height: 1; padding: 0; }
.qf-btn:disabled { opacity: 0.4; cursor: default; }
.qf-btn:active:not(:disabled) { transform: scale(0.96); }
.qf-value { font: 600 28px/1 var(--display); min-width: 3em; text-align: center; font-variant-numeric: lining-nums; }
.qf-note { color: var(--muted); font-size: 13px; }
.v-strong { --v: #d9480f; }
.v-medium { --v: #e8890c; }
.v-weak { --v: #b79b1a; }
.v-none { --v: #5b6b8c; }
.quick-summary { position: sticky; top: 0; z-index: 2; border-radius: 16px; padding: 12px 14px; margin: 10px 0; background: var(--surface-2); border: 1px solid var(--line); }
.quick-summary[class*="v-"] { border-color: var(--v); background: color-mix(in srgb, var(--v) 9%, var(--surface)); }
.quick-summary.pick, .quick-summary[class*="v-"] { box-shadow: 0 6px 10px -6px rgba(86, 58, 20, 0.25); }
.quick-summary small { color: var(--muted); font-size: 12.5px; }
.quick-summary .big { display: block; font: 650 25px/1.25 var(--display); color: var(--v); }
.quick-summary p { margin: 2px 0; }
.quick-cards { display: grid; gap: 8px; margin: 8px 0; }
.side-card { text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "head chart" "text chart"; gap: 4px 12px; align-items: center; padding: 10px 12px; min-height: 76px; border-radius: 14px; border: 1.5px solid var(--line); border-left: 7px solid var(--v); background: var(--surface); }
.side-card.on { border-color: var(--focus); border-left-color: var(--v); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent); background: color-mix(in srgb, var(--v) 7%, var(--surface)); }
.sc-head { grid-area: head; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sc-head b { font-size: 16px; }
.verdict { font-size: 12.5px; font-weight: 700; padding: 1px 9px; border-radius: 999px; color: #fff; background: var(--v); }
.sc-text { grid-area: text; display: grid; gap: 1px; font-size: 13px; color: var(--muted); }
.bars { grid-area: chart; display: flex; align-items: flex-end; gap: 2px; height: 38px; width: 70px; }
.bars i { flex: 1; background: var(--sun); border-radius: 1px; min-height: 2px; }
.quick-adv { display: grid; gap: 8px; margin: 12px 0 6px; }
.quick-adv h3 { margin: 0; }
.adv-btn { text-align: left; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); min-height: 58px; display: flex; flex-direction: column; gap: 2px; }
.adv-btn small { color: var(--muted); font-size: 12.5px; }
.adv-btn[aria-disabled="true"], .adv-btn:disabled { opacity: 0.6; }
.quick-deals { margin: 14px 0 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.deals-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.deals-head h3 { margin: 0; }
.deals-flag { font-size: 12.5px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); }
.deals-lines p { margin: 8px 0; display: grid; gap: 1px; }
.deals-lines b { font-size: 15px; }
.deals-lines span { color: var(--muted); font-size: 13.5px; }
.quick-deals h4 { margin: 12px 0 4px; font-size: 14px; }
.deal-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.deal-row { display: grid; gap: 1px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); border-left-width: 5px; background: var(--surface); }
.deal-row.sale { border-left-color: var(--accent); }
.deal-row.rent { border-left-color: #5b6b8c; }
.deal-row b { font-size: 14px; }
.deal-row span { color: var(--muted); font-size: 13px; }
.deals-source { margin: 4px 0; }
.deals-units { margin-top: 10px; }
.quick-how { margin: 6px 0; }
.cmp-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cmp-head h2 { margin: 0; }
.cmp-grid { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(160px, 1fr); gap: 8px; overflow-x: auto; margin: 10px 0; padding-bottom: 6px; }
.cmp-col { border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 12px; background: var(--surface-2); min-width: 0; }
.cmp-col h3 { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); margin: 0 0 4px; overflow-wrap: anywhere; }
.cmp-side { border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 6px; }
.cmp-side p { margin: 2px 0; font-size: 13px; }
.cmp-side .bars { width: 100%; }
.cmp-col .mini { margin-top: 8px; }
.cmp-line { font-size: 13px; margin: 2px 0; }
html[data-quick] .toast { top: calc(70px + env(safe-area-inset-top)); bottom: auto; transform: translate(-50%, -16px); }
html[data-quick] .toast.show { transform: translate(-50%, 0); }
@media (max-width: 380px) { .quick-foot { flex-wrap: wrap; } }
/* on a short or a narrow screen the links under the sheet scroll with it, so that the answer has the room */
@media (max-height: 700px), (max-width: 380px) {
  .quick-sheet { overflow: auto; overscroll-behavior: contain; }
  .quick-body { overflow: visible; flex: none; }
}
@media (min-width: 900px) {
  .quick { grid-template-columns: minmax(0, 1fr) 440px; grid-template-rows: auto minmax(0, 1fr); }
  .quick-search { grid-column: 1 / -1; max-width: 760px; width: 100%; margin: 0 auto; }
  .quick-map { grid-column: 1; grid-row: 2; margin: 0 0 12px 12px; border: 1px solid var(--line); border-radius: 22px; }
  .quick-sheet { grid-column: 2; grid-row: 2; max-height: none; margin: 0 12px 12px 12px; border-radius: 22px; border: 1px solid var(--line); box-shadow: var(--shadow); }
  .quick-grab { display: none; }
  .quick-sheet[data-open="0"] .quick-body { display: block; }
  .quick-body { padding-top: 12px; }
}
@media (pointer: coarse) {
  .quick-foot .linkbtn { min-height: 44px; display: inline-flex; align-items: center; }
  .quick-foot .select { min-height: 44px; }
  .quick-grab { min-height: 30px; height: 30px; }
  .cmp-col .mini { min-height: 44px; }
}
</style>

s":"Geb\xE4udeumrisse laden (OpenStreetMap)","wiz.face.outlinesOn":"{n} Geb\xE4ude sind geladen. Schiebe das Zimmer auf dein Haus: halte es kurz gedr\xFCckt und ziehe, oder ziehe den Griff auf der gegen\xFCberliegenden Seite. Drehe es mit zwei Fingern oder dem runden Griff.","wiz.face.align":"Fensterwand an das Geb\xE4ude ausrichten","wiz.face.aligned":"Um {n} Grad gedreht, damit die Fensterwand einer Geb\xE4udewand folgt. Sie zeigt jetzt nach {dir}.","wiz.face.alignedAlready":"Die Fensterwand folgt schon einer Geb\xE4udewand.","wiz.face.alignNote":"Nutze das, wenn das Fenster in einer Hauptwand deines Geb\xE4udes liegt. Ein Erker oder ein schr\xE4ger Fl\xFCgel passt nicht.","wiz.face.outlinesOff":"Lade die Umrisse, um das Zimmer an deinem Geb\xE4ude auszurichten. Dazu fragt Sunspill einen OpenStreetMap-Server nach Geb\xE4uden im Umkreis von 200 Metern.","wiz.face.northNote":"Zum Verschieben halte das Zimmer kurz gedr\xFCckt und ziehe, oder ziehe den Griff auf der gegen\xFCberliegenden Seite. Ziehst du woanders, wandert die Karte. Ein Handykompass wird durch Metall und Elektronik um einige Grad verf\xE4lscht. Vergleiche ihn mit der Karte.","wiz.map.loading":"Geb\xE4ude werden bei OpenStreetMap abgefragt.","wiz.map.another":"Dieser Server hat nicht geantwortet. Versuche {host}.","wiz.map.loaded":"{n} Geb\xE4ude geladen.","wiz.map.partial":"{n} von {total} Geb\xE4uden wurden behalten: die, die am h\xF6chsten \xFCber deinem Fenster aufragen. Die \xFCbrigen ragen weniger als {deg} Grad dar\xFCber auf und beschatten nur eine tiefere Sonne. Lade nach einer \xC4nderung der Etage erneut.","wiz.map.empty":"OpenStreetMap kennt hier keine Geb\xE4ude. F\xFCge sie von Hand hinzu, falls es welche gibt.","wiz.map.failed":"Kein OpenStreetMap-Server hat die Geb\xE4ude geschickt, meist weil die \xF6ffentlichen ausgelastet sind. Versuche es in einer Minute noch einmal oder f\xFCge die Geb\xE4ude unten von Hand hinzu.","wiz.sur.intro":"Geb\xE4ude und B\xE4ume zwischen Fenster und Sonne } an: {corner}.","wiz.photo.corner.1":"unten links im Plan","wiz.photo.corner.2":"unten rechts","wiz.photo.corner.3":"oben rechts","wiz.photo.corner.4":"oben links","wiz.photo.order":"Der Plan wird von oben gesehen, die Fensterwand liegt oben. Tippe die vier Ecken an, an denen der Boden auf die W\xE4nde trifft, in dieser Reihenfolge.","wiz.photo.flattening":"Das Foto wird entzerrt.","wiz.photo.bad":"Diese Ecken ergeben kein Zimmer. Versuche es noch einmal.","wiz.photo.ready":"Das Foto liegt jetzt unter dem Plan. Markiere darauf den Sonnenfleck.","wiz.fit.overlap":"\xDCberdeckung: jetzt {a}, nach der Anpassung {b}","wiz.fit.nothing":"Das Modell stimmt schon so gut wie m\xF6glich mit deinen Markierungen \xFCberein. Nichts zu \xE4ndern.","wiz.fit.noTurn":"Die Richtung bleibt, wie sie ist.","wiz.fit.turn":"Drehe das Zimmer um {deg}, sodass es nach {to} zeigt.","wiz.fit.window":"Verschiebe Fenster {n} um {slide} nach {side} und die Br\xFCstung um {sill} {dir}.","wiz.fit.right":"rechts","wiz.fit.left":"links","wiz.fit.higher":"h\xF6her","wiz.fit.lower":"tiefer","wiz.fit.oneCheck":"Eine Beobachtung zeigt nur die Richtung. Markiere eine weitere Uhrzeit, um auch das Fenster anzupassen.","wiz.fit.facingOnly":"Nur die Richtung \xE4ndert sich: Das Fenster zus\xE4tzlich zu verschieben verbesserte die \xDCberdeckung nicht genug.","wiz.fit.apply":"Anwenden","wiz.fit.dismiss":"Jetzt nicht","wiz.fit.applied":"Angepasst. Du kannst es r\xFCckg\xE4ngig machen.","kind.shelf":"Regal","wiz.things.onPlan":"Im Zimmer","app.restored":"Dein letztes Zimmer wurde aus diesem Browser wiederhergestellt. Im Tab Teilen kannst du neu anfangen.","wiz.check.byNumbers":"Eine Ecke \xFCber ihre Abst\xE4nde hinzuf\xFCgen","wiz.check.addCorner":"Diese Ecke hinzuf\xFCgen","wiz.sur.shadeNow":"Um {time} werfen {n} davon ihren Schatten auf ein Fenster. Sie sind auf der Karte orange umrandet.","wiz.sur.shadeNone":"Um {time} wirft keines davon einen Schatten auf ein Fenster.","wiz.map.sunNote":"Die gepunktete Lin
